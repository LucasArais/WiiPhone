<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Controle — WiiPhone</title>
  <link rel="stylesheet" href="/controller.css">
</head>
<body>
  <header><b id="player-badge">WiiPhone</b><span id="status" role="status">Pronto para conectar</span><a href="/">⌂ Menu</a></header>
  <main>
    <section id="setup">
      <h1>Seu celular é o volante.</h1>
      <p>Segure de lado, com a tela voltada para cima. Deixe o direcional à esquerda e os botões 1 e 2 à direita.</p>
      <button id="enable">Ativar sensores e conectar</button>
    </section>
    <section id="remote" hidden aria-label="Controle de corrida">
      <div class="dpad" aria-label="Escolher piloto e usar item">
        <button data-button="up" aria-label="Cima">▲</button>
        <button data-button="left" aria-label="Esquerda">◀</button>
        <button data-button="right" aria-label="Direita e usar item">▶<small>ITEM</small></button>
        <button data-button="down" aria-label="Baixo">▼</button>
      </div>
      <div class="center"><span class="eyebrow">MARIO KART</span><div id="wheel">◉</div><p id="hint">Nivele o celular para calibrar</p><button id="recenter">− Recalibrar</button></div>
      <div class="actions"><button data-button="A" class="drift">A<small>DRIFT</small></button><button data-button="1">1<small>FREIO</small></button><button data-button="2" class="gas">2<small>ACELERAR / OK</small></button></div>
    </section>
  </main>
  <footer>Incline para virar · segure A nas curvas · solte para ganhar turbo</footer>
  <script src="/controller.js"></script>
</body>
</html>
