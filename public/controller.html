<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>WiiPhone Controller</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      touch-action: none;
      user-select: none;
    }
    #status {
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 24px;
    }
    #status.connected { color: var(--ok); }
    #player-badge {
      font-size: 44px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    #enable {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 18px 32px;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(255, 77, 109, 0.35);
    }
    #wheel {
      width: min(70vw, 260px);
      height: min(70vw, 260px);
      border-radius: 50%;
      border: 6px solid var(--border);
      display: none;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      position: relative;
    }
    #wheel .needle {
      position: absolute;
      width: 6px;
      height: 42%;
      background: var(--accent-2);
      top: 8%;
      left: calc(50% - 3px);
      border-radius: 4px;
      transform-origin: bottom center;
    }
    #hint {
      color: var(--text-dim);
      font-size: 13px;
      max-width: 260px;
    }
  </style>
</head>
<body>
  <div id="player-badge">WiiPhone</div>
  <div id="status">not connected</div>

  <div id="wheel"><div class="needle" id="needle"></div></div>
  <p id="hint">Hold the phone flat, screen up. Tilt left and right to steer.</p>

  <button id="enable">Enable motion sensors</button>

  <script src="/core/motion.js"></script>
  <script src="/controller.js"></script>
</body>
</html>
